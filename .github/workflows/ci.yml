# .github/workflows/ci.yml

name: CI

permissions:
  contents: read
  pages: write
  id-token: write
# Controls when the workflow will run
on:
  # all branches
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5672:5672

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v3

      # Sets up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"
          cache: "npm" # Caches npm dependencies

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check benchmark comparison contracts
        run: npm run test:benchmark-compare

      - name: Check documentation generator
        run: npm run test:docs

      # Run tests with enforced 100% coverage
      - name: Run tests with coverage enforcement
        env:
          # Enables the durable "real backends" integration suite (Redis + RabbitMQ).
          DURABLE_INTEGRATION: "1"
          DURABLE_TEST_REDIS_URL: "redis://127.0.0.1:6379"
          DURABLE_TEST_RABBIT_URL: "amqp://127.0.0.1:5672"
          # Enables Redis resilience coordination and recovery integration suites.
          RESILIENCE_REDIS_URL: "redis://127.0.0.1:6379"
          # Enables Event Lanes real RabbitMQ integration suite.
          EVENT_LANES_INTEGRATION: "1"
          EVENT_LANES_TEST_RABBIT_URL: "amqp://127.0.0.1:5672"
        run: npm run test:ci

      # Generate documentation (only on main branch)
      - name: Generate documentation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run typedoc

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

  # Deploy runs as its own job so a flaky Pages API call can be re-run without repeating the 5-minute suite,
  # and the concurrency group serializes deployments instead of racing artifact cleanup between pushes.
  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
