name: Benchmark Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          # Ensure caching works with multi-checkout (head/base)
          cache-dependency-path: "**/package-lock.json"

      - name: Use the same benchmark workload for both revisions
        run: |
          # Compare both runtimes with identical workloads, including new metrics.
          cp -R head/src/__tests__/benchmark/. base/src/__tests__/benchmark/
          cp head/config/jest/jest.bench.config.js base/config/jest/jest.bench.config.js

      - name: Install deps (base)
        working-directory: base
        run: npm ci

      - name: Run benchmarks (base)
        working-directory: base
        env:
          NODE_OPTIONS: --expose-gc
          BENCHMARK_OUTPUT: ${{ github.workspace }}/base/config/benchmarks/baseline-ci.json
          CI: true
          GITHUB_ACTIONS: true
        run: npm run benchmark

      - name: Install deps (head)
        working-directory: head
        run: npm ci

      - name: Run benchmarks (head)
        working-directory: head
        env:
          NODE_OPTIONS: --expose-gc
          BENCHMARK_OUTPUT: ${{ github.workspace }}/head/config/benchmarks/benchmark-results-ci.json
          CI: true
          GITHUB_ACTIONS: true
        run: npm run benchmark

      - name: Check distribution entrypoints and consumer bundles
        working-directory: head
        run: >-
          npm run build &&
          npm run check:entrypoints &&
          npm run check:consumers

      - name: Compare fresh results against protected base thresholds
        run: >-
          node head/scripts/compare-benchmarks.mjs
          base/config/benchmarks/baseline-ci.json
          head/config/benchmarks/benchmark-results-ci.json
          base/config/benchmarks/benchmarks.config.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-outputs
          path: |
            base/config/benchmarks/baseline-ci.json
            head/config/benchmarks/benchmark-results-ci.json
